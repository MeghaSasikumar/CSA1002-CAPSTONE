services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: parksmart
      POSTGRES_PASSWORD: parksmart
      POSTGRES_DB: parksmart
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parksmart"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://parksmart:parksmart@db:5432/parksmart
      JWT_SECRET: change-this-secret
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
